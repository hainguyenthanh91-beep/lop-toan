name: Build APK + Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'
          cache: true

      - name: Chuan bi
        run: python3 -m pip install --break-system-packages -q pillow || sudo apt-get install -y python3-pil

      - name: Luu dem Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-flutter-3.29.3-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-flutter-3.29.3-

      - name: Tao khung Android
        run: |
          flutter create --platforms=android --org vn.thayhai --project-name lop_toan .
          rm -rf test
          python3 tools/patch_android.py

      - name: Cai thu vien
        run: flutter pub get

      - name: Kiem tra file Excel mau
        run: dart run tools/xlsx_sample.dart

      - name: Doc thu file Excel bang openpyxl
        run: |
          python3 -m pip install --break-system-packages -q openpyxl || pip install -q openpyxl
          python3 tools/check_xlsx.py xlsx-sample.xlsx

      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}

      - name: Doi ten file
        run: cp build/app/outputs/flutter-apk/app-release.apk LopToan-v${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LopToan-apk
          path: LopToan-v${{ github.run_number }}.apk

      - name: Dang ban tai ve (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Lớp Toán – bản ${{ github.run_number }}
          body: |
            📱 Điện thoại: tải file .apk về rồi bấm để cài.
            💻 Máy tính Windows: tải file LopToan-Windows-....zip, giải nén, mở LopToan.exe (file Windows được thêm sau vài phút).
          files: LopToan-v${{ github.run_number }}.apk

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tao khung Windows
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          python -m pip install -q pillow
          flutter create --platforms=windows --org vn.thayhai --project-name lop_toan .
          rm -rf test
          python tools/patch_windows.py

      - name: Build Windows
        shell: bash
        run: |
          flutter pub get
          flutter build windows --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}

      - name: Dong goi
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          Rename-Item "$src/lop_toan.exe" "LopToan.exe"
          New-Item -ItemType Directory -Force -Path "LopToan" | Out-Null
          Copy-Item -Recurse "$src/*" "LopToan/"
          Compress-Archive -Path "LopToan" -DestinationPath "LopToan-Windows-v${{ github.run_number }}.zip"

      - name: Dang ban Windows
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: LopToan-Windows-v${{ github.run_number }}.zip
